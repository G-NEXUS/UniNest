<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniNest - Boarding House Agent & Room Unlock</title>
    <meta name="description" content="Student boarding house discovery and verification platform with secure landlord contact unlocking, agent verification, and student accommodation listings." />
    <meta property="og:title" content="UniNest - Boarding House Agent & Room Unlock" />
    <meta property="og:description" content="Student boarding house discovery and verification platform with secure landlord contact unlocking, agent verification, and student accommodation listings." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/index.css" />
  </head>
  <body class="bg-black text-blue-50 selection:bg-blue-600 selection:text-white min-h-screen">
    <!--
      Static page shell:
      - HTML provides the document, app container, and no-JavaScript message.
      - CSS provides the complete visual design and responsive layout.
      - JavaScript fills #root with the data-driven student, landlord, and admin screens.
    -->
    <div id="app-shell">
      <div id="root" aria-live="polite">
        <!-- JavaScript replaces this loading message with the application screens. -->
        <main class="min-h-screen bg-black text-white flex items-center justify-center">
          <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin" aria-label="Loading UniNest"></div>
        </main>
      </div>
      <noscript>
        <main class="min-h-screen bg-black text-white flex items-center justify-center p-6 text-center">
          <p>UniNest needs JavaScript enabled to provide listings, role switching, filters, payments, and contact unlocking.</p>
        </main>
      </noscript>
    </div>
    <script type="module" src="/js/index.js"></script>
  </body>
</html>
